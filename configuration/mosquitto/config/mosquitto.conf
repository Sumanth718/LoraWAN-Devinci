# Prototype setting: anonymous access, but port 1883 is only published on
# 127.0.0.1 by docker-compose.yml, so only containers on the internal Docker
# network and the host itself can reach the broker.
#
# Before opening MQTT to anything else (students' apps, another host), switch to
# per-user passwords + ACLs and TLS on 8883. See docs/security-notes.md (WP3).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
